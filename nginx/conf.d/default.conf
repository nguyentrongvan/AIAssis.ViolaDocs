# Upstream backend API
upstream backend_api {
    server backend:8000;
    keepalive 32;
}

# HTTP server - redirects to HTTPS if SSL is enabled
server {
    listen 80;
    server_name _;

    # For Let's Encrypt certificate validation
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    # Redirect to HTTPS if SSL is enabled (uncomment when SSL is configured)
    # return 301 https://$host$request_uri;

    # Temporary: serve HTTP (comment out when SSL is enabled)
    include /etc/nginx/conf.d/app.conf;
}

