# Production mode configuration
# Extends docker-compose.base.yml with prod-specific overrides

services:
  backend:
    # In production, backend is only accessible via nginx (no exposed ports)
    environment:
      DEBUG: "false"
      LOG_LEVEL: "INFO"

  frontend:
    # In production, frontend is served via nginx (no exposed ports)
    build:
      args:
        VITE_API_BASE: ${VITE_API_BASE:-/api/v1}

  nginx:
    build:
      context: ../nginx
      dockerfile: Dockerfile
    container_name: violadocs_nginx
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ../nginx/conf.d:/etc/nginx/conf.d:ro
      - ../nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - certbot_data:/etc/letsencrypt
      - certbot_www:/var/www/certbot
    networks:
      - violadocs_network
    depends_on:
      - backend
      - frontend
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost/health"]
      interval: 30s
      timeout: 3s
      start_period: 5s
      retries: 3

volumes:
  certbot_data:
  certbot_www:

