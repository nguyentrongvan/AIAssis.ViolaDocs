# Development mode configuration
# Extends docker-compose.base.yml with dev-specific overrides

services:
  backend:
    ports:
      - "${BACKEND_PORT:-8000}:8000"
    environment:
      DEBUG: "true"
      LOG_LEVEL: "DEBUG"
    # Remove nginx dependency for dev mode
    depends_on:
      postgres:
        condition: service_healthy
      minio:
        condition: service_healthy
      redis:
        condition: service_healthy
      qdrant:
        condition: service_started
      ollama:
        condition: service_started

  frontend:
    build:
      context: ../src/frontend
      dockerfile: Dockerfile.dev
    ports:
      - "${FRONTEND_PORT:-3000}:3000"
    environment:
      - VITE_API_BASE=${VITE_API_BASE:-http://localhost:8000/api/v1}
    volumes:
      # Mount source code for hot reload
      - ../src/frontend/src:/app/src
      - ../src/frontend/public:/app/public
      - ../src/frontend/index.html:/app/index.html
      - ../src/frontend/vite.config.js:/app/vite.config.js
      - ../src/frontend/package.json:/app/package.json
      # Exclude node_modules from volume mount
      - /app/node_modules

