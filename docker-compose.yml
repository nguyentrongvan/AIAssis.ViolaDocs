version: '3.8'

services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: viadocs_postgres
    environment:
      POSTGRES_USER: viadocs
      POSTGRES_PASSWORD: viadocs_pass
      POSTGRES_DB: viadocs_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U viadocs"]
      interval: 10s
      timeout: 5s
      retries: 5

  minio:
    image: minio/minio:latest
    container_name: viadocs_minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin123
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 30s
      timeout: 20s
      retries: 3

  redis:
    image: redis:7-alpine
    container_name: viadocs_redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  qdrant:
    image: qdrant/qdrant:latest
    container_name: viadocs_qdrant
    ports:
      - "6333:6333"  # HTTP API and Web UI
      - "6334:6334"  # gRPC API
    volumes:
      - qdrant_data:/qdrant/storage
    environment:
      QDRANT__SERVICE__GRPC_PORT: 6334
    # Healthcheck removed - Qdrant container doesn't have wget/curl
    # Container will be considered healthy if it's running
    # Worker will handle connection errors gracefully

  ollama:
    image: ollama/ollama:latest
    container_name: viadocs_ollama
    ports:
      - "11434:11434"
    volumes:
      - ollama_data:/root/.ollama
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:11434/api/tags"]
      interval: 30s
      timeout: 10s
      retries: 3

  ocr-worker:
    build:
      context: ./src/backend
      dockerfile: docker/Dockerfile.worker
    container_name: viadocs_ocr_worker
    environment:
      # Database
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      POSTGRES_USER: viadocs
      POSTGRES_PASSWORD: viadocs_pass
      POSTGRES_DB: viadocs_db
      # MinIO
      MINIO_ENDPOINT: minio:9000
      MINIO_ACCESS_KEY: minioadmin
      MINIO_SECRET_KEY: minioadmin123
      MINIO_SECURE: "false"
      MINIO_BUCKET: documents
      # Ollama - Use Docker service name
      OLLAMA_BASE_URL: http://ollama:11434
      OLLAMA_EMBEDDING_MODEL: nomic-embed-text:latest
      # Qdrant - Use Docker service name for HTTP client
      QDRANT_HOST: qdrant
      QDRANT_PORT: 6333
      QDRANT_GRPC_PORT: 6334
      QDRANT_COLLECTION: embeddings
      QDRANT_API_KEY: ""
      # Worker config
      OCR_WORKER_POLL_INTERVAL: 2
      OCR_WORKER_MAX_CONCURRENT: 2
      OCR_WORKER_HEARTBEAT_INTERVAL: 30
      OCR_WORKER_STUCK_TIMEOUT: 10
    depends_on:
      postgres:
        condition: service_healthy
      minio:
        condition: service_healthy
      qdrant:
        condition: service_started
    restart: unless-stopped
    # Scale with: docker-compose up -d --scale ocr-worker=2

  purge-worker:
    build:
      context: ./src/backend
      dockerfile: docker/Dockerfile.purge-worker
    container_name: viadocs_purge_worker
    environment:
      # Database
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      POSTGRES_USER: viadocs
      POSTGRES_PASSWORD: viadocs_pass
      POSTGRES_DB: viadocs_db
      # MinIO
      MINIO_ENDPOINT: minio:9000
      MINIO_ACCESS_KEY: minioadmin
      MINIO_SECRET_KEY: minioadmin123
      MINIO_SECURE: "false"
      MINIO_BUCKET: documents
      # Qdrant - Use Docker service name for HTTP client
      QDRANT_HOST: qdrant
      QDRANT_PORT: 6333
      QDRANT_GRPC_PORT: 6334
      QDRANT_COLLECTION: embeddings
      QDRANT_API_KEY: ""
      # Worker config
      PURGE_WORKER_POLL_INTERVAL: 3600
      PURGE_WORKER_BATCH_SIZE: 100
      PURGE_WORKER_DRY_RUN: "false"
    depends_on:
      postgres:
        condition: service_healthy
      minio:
        condition: service_healthy
      qdrant:
        condition: service_started
    restart: unless-stopped

volumes:
  postgres_data:
  minio_data:
  redis_data:
  qdrant_data:
  ollama_data:




